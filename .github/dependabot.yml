# Weekly pull requests when a dependency or a GitHub Action has a new version,
# security fixes included. CI (tests + pip-audit) runs on each of them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
