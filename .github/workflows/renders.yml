name: Wheel renders

# Renders the wheel on Windows (real Segoe UI fonts) and publishes the images
# on the `renders` branch, so the design can be reviewed without running the app.
on:
  push:
    branches: [main]
    paths: ["spicchio/ui/**", "spicchio/actions/**", "scripts/render_wheel.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: python scripts/render_wheel.py renders
      - name: Demo video and GIF
        shell: bash
        run: |
          pip install imageio-ffmpeg
          python scripts/render_demo.py demo
          FF=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          "$FF" -y -loglevel error -framerate 30 -i demo/frames/%04d.png -c:v libx264 -crf 18 -preset slow -pix_fmt yuv420p -movflags +faststart renders/demo.mp4
          "$FF" -y -loglevel error -framerate 30 -i demo/frames/%04d.png -vf "fps=20,scale=880:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=192:stats_mode=diff[p];[b][p]paletteuse=dither=sierra2_4a" renders/demo.gif
          for f in 0030 0060 0075 0100 0115 0140; do cp demo/frames/$f.png renders/demo-frame-$f.png; done
      - name: Publish on the renders branch
        shell: bash
        run: |
          cd renders
          git init -q -b renders
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Wheel renders for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" renders
