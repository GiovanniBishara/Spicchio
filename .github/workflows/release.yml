name: Release

# Publish a release on GitHub (Releases → Draft a new release → tag v0.1.0 → Publish):
# this workflow builds the Windows and macOS apps and attaches them to it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job, only to attach files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums, so anyone can verify the download
        working-directory: dist
        run: sha256sum Spicchio-windows.zip Spicchio-macOS.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach the apps to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/Spicchio-windows.zip dist/Spicchio-macOS.zip dist/SHA256SUMS.txt --clobber
