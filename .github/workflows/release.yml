name: Release

# Publish a release on GitHub (Releases → Draft a new release → tag v0.1.0 → Publish):
# this workflow builds the Windows and macOS apps and attaches them to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  attach:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach the apps to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/Spicchio-windows.zip dist/Spicchio-macOS.zip --clobber
